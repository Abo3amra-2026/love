<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لجنجونتي ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            color: white;
            position: fixed; 
        }

        #intro-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050005;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        #start-btn {
            padding: 18px 45px;
            font-size: 20px;
            font-weight: 800;
            color: white;
            background: linear-gradient(45deg, #ff0a54, #ff477e);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 10, 84, 0.6);
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none;
            z-index: 40;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
        }

        #content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8vh;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        .glow-title {
            font-size: 26px;
            color: #ffb3c6;
            text-shadow: 0 0 15px #ff0a54;
            margin-bottom: 15px;
            text-align: center;
        }

        .glass-box {
            background: rgba(20, 0, 5, 0.8);
            border: 1px solid rgba(255, 10, 84, 0.4);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 90%;
            max-width: 400px;
        }

        .timer-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 10, 84, 0.2);
            padding: 8px;
            border-radius: 12px;
            min-width: 55px;
        }

        .time-val {
            font-size: 22px;
            font-weight: 800;
            color: white;
        }

        .time-label {
            font-size: 11px;
            color: #ffb3c6;
        }
    </style>
</head>
<body>

    <div id="intro-layer">
        <button id="start-btn">دوسي هنا ي جنجونتي ❤️</button>
    </div>

    <div id="container-wipe" class="video-container">
        <video id="video-wipe" playsinline webkit-playsinline>
            <source src="wipe.mp4" type="video/mp4">
        </video>
    </div>

    <div id="container-paint" class="video-container">
        <video id="video-paint" playsinline webkit-playsinline>
            <source src="paint.mp4" type="video/mp4">
        </video>
    </div>

    <canvas id="canvas"></canvas>

    <div id="content">
        <div class="glow-title">إلى حب حياتي جنجونتي</div>
        <div class="glass-box">
            <p style="color: #ffccd5; font-size: 16px;">حبي لك بيكبر من...</p>
            <div class="timer-row">
                <div class="time-box"><span id="days" class="time-val">0</span><span class="time-label">يوم</span></div>
                <div class="time-box"><span id="hours" class="time-val">00</span><span class="time-label">ساعة</span></div>
                <div class="time-box"><span id="mins" class="time-val">00</span><span class="time-label">دقيقة</span></div>
                <div class="time-box"><span id="secs" class="time-val">00</span><span class="time-label">ثانية</span></div>
            </div>
            <p style="color: #ffccd5; font-size: 16px;">وإلى الأبد... ❤️</p>
        </div>
    </div>

    <script>
        const vWipe = document.getElementById('video-wipe');
        const vPaint = document.getElementById('video-paint');
        const cWipe = document.getElementById('container-wipe');
        const cPaint = document.getElementById('container-paint');
        const startBtn = document.getElementById('start-btn');
        const introLayer = document.getElementById('intro-layer');
        const content = document.getElementById('content');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        let particles = [];
        let isMagicActive = false;

        startBtn.addEventListener('click', () => {
            introLayer.style.opacity = '0';
            vPaint.load(); 

            setTimeout(() => {
                introLayer.style.display = 'none';
                cWipe.style.display = 'block';
                vWipe.play();
            }, 600);
        });

        vWipe.onended = () => {
            cWipe.style.display = 'none';
            cPaint.style.display = 'block';
            
            setTimeout(() => {
                vPaint.play().catch(startFinalMagic);
            }, 100);
        };

        vPaint.onended = startFinalMagic;

        function startFinalMagic() {
            cPaint.style.opacity = '0';
            setTimeout(() => {
                cPaint.style.display = 'none';
                isMagicActive = true;
                initParticles();
                content.style.display = 'flex';
                setTimeout(() => content.style.opacity = '1', 500);
            }, 800);
        }

        const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ffffff', '#ffb3c6'];
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * scale, y: y * scale };
        }

        function initParticles() {
            const count = w < 768 ? 1000 : 2000;
            const scale = Math.min(w, h) / (w < 768 ? 35 : 45);
            for(let i=0; i<count; i++) {
                const t = Math.random() * Math.PI * 2;
                const pt = getHeartPoint(t, scale * (0.4 + Math.random() * 0.6));
                particles.push({
                    x: w/2, y: h + 50,
                    tx: w/2 + pt.x, ty: h * 0.38 + pt.y,
                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                    size: Math.random()*2 + 1,
                    color: colors[Math.floor(Math.random()*colors.length)]
                });
            }
        }

        function animate() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(5, 0, 5, 0.2)';
            ctx.fillRect(0, 0, w, h);
            
            if(isMagicActive) {
                ctx.globalCompositeOperation = 'lighter';
                particles.forEach(p => {
                    p.vx += (p.tx - p.x) * 0.02;
                    p.vy += (p.ty - p.y) * 0.02;
                    p.vx *= 0.92; p.vy *= 0.92;
                    p.x += p.vx; p.y += p.vy;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fill();
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- العداد مظبوط بدقة على تاريخ 6/9/2026 ---
        const startDate = new Date("2026-09-06T00:00:00");
        function updateTimer() {
            const diff = Math.floor((new Date() - startDate) / 1000);
            if (diff < 0) return;
            document.getElementById('days').innerText = Math.floor(diff / 86400);
            document.getElementById('hours').innerText = Math.floor((diff % 86400) / 3600).toString().padStart(2, '0');
            document.getElementById('mins').innerText = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            document.getElementById('secs').innerText = (diff % 60).toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
